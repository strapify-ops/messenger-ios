# XcodeGen spec. On CI: brew install xcodegen && xcodegen generate. Nothing generated is committed.
name: Messenger
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-AU
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Messenger:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/Messenger.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.messenger
        PRODUCT_NAME: Messenger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(MS_PROFILE_APP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Messenger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Take photos to send in a conversation and turn your camera on in a huddle.
        NSMicrophoneUsageDescription: Talk in huddles and record voice messages.
        NSPhotoLibraryUsageDescription: Choose photos to send in a conversation.
        NSPhotoLibraryAddUsageDescription: Save photos from a conversation to your library.
